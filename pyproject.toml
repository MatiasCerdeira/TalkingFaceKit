[project]
name = "talkingfacekit"
version = "0.1.0"
description = "A modular library for processing talking-face videos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "av>=18.0.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
active-speaker-deeptalk = [
    "deeptalk-asd==0.3.1",
]
tracking-mediapipe = [
    "mediapipe>=1.0.0",
]
rendering = [
    "plotly>=6.9.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
conflicts = [
    [
        { extra = "active-speaker-deeptalk" },
        { extra = "tracking-mediapipe" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B","I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
